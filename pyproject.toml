[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-copilot"
version = "0.1.0"
description = "A private, extensible Windows desktop AI copilot"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "pydantic>=2.7,<3", "pydantic-settings>=2.3,<3", "httpx>=0.27,<1", "platformdirs>=4.2,<5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pytest-asyncio>=0.23,<1", "ruff>=0.5,<1", "mypy>=1.10,<2"]
google-sheets = ["google-api-python-client>=2.130,<3", "google-auth-oauthlib>=1.2,<2"]
package = ["pyinstaller>=6.8,<7"]

[project.scripts]
copilot = "copilot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
